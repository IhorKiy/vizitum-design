<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
body { margin:0; background:#E7E5DE; font-family:Manrope,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#14604a; text-decoration:none; }
a:hover { color:#0d4636; }
</style>
</helmet>
<div style="width:393px; height:852px; margin:0 auto; background:#F3F2ED; overflow:hidden; position:relative; display:flex; flex-direction:column">

  <div style="flex:none; background:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #E6E4DD">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" style="flex:none; cursor:pointer" onClick="{{ handleBack }}"><path d="M19 12H5.5m0 0 5.2-5.2M5.5 12l5.2 5.2" stroke="#14604a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    <div style="flex:1; font-size:16px; font-weight:800; color:#1A1A17">Про точку</div>
  </div>

  <div style="flex:1; min-height:0; overflow-y:auto; padding:16px 16px 20px; display:flex; flex-direction:column; gap:12px">

    <div style="display:flex; flex-direction:column; gap:3px">
      <div style="font-size:22px; font-weight:800; color:#14181a; letter-spacing:-.02em; text-wrap:pretty">{{ name }}</div>
      <div style="font-size:14.5px; color:#8A8F98; font-weight:600">{{ address }}</div>
    </div>

    <div style="padding:14px 15px; background:#fff; border:1px solid #E7E5E0; border-radius:15px; display:flex; flex-direction:column; gap:10px">
      <div style="display:flex; align-items:center; gap:10px">
        <div style="width:32px; height:32px; flex:none; border-radius:10px; background:#E6EFEB; display:flex; align-items:center; justify-content:center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11Z" stroke="#14604a" stroke-width="1.8" stroke-linejoin="round" /><circle cx="12" cy="10" r="2.4" stroke="#14604a" stroke-width="1.8" /></svg>
        </div>
        <div style="flex:1; font-size:15px; font-weight:700; color:#14181a">{{ address }}</div>
      </div>
      <div style="height:1px; background:#F0EEE9"></div>
      <div style="display:flex; align-items:center; gap:10px">
        <div style="width:32px; height:32px; flex:none; border-radius:10px; background:#E6EFEB; display:flex; align-items:center; justify-content:center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M22 16.9v2.6a1.6 1.6 0 0 1-1.7 1.6 15.6 15.6 0 0 1-6.8-2.4 15.3 15.3 0 0 1-4.7-4.7 15.6 15.6 0 0 1-2.4-6.9A1.6 1.6 0 0 1 8 4.7h2.6a1.6 1.6 0 0 1 1.6 1.4c.1.9.3 1.8.6 2.6a1.6 1.6 0 0 1-.4 1.7l-1.1 1.1a12.7 12.7 0 0 0 4.7 4.7l1.1-1.1a1.6 1.6 0 0 1 1.7-.4c.8.3 1.7.5 2.6.6a1.6 1.6 0 0 1 1.4 1.6Z" stroke="#14604a" stroke-width="1.7" stroke-linejoin="round" /></svg>
        </div>
        <div style="flex:1; font-size:15px; font-weight:700; color:#14181a">{{ contact }}</div>
      </div>
    </div>

    <div style="padding:14px 15px; background:#fff; border:1px solid #E7E5E0; border-radius:14px; display:flex; flex-direction:column; gap:8px">
      <div style="font-size:15.5px; font-weight:800; color:#14181a">Задачі на візит</div>
      <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="2">
        <div style="display:flex; align-items:center; gap:9px; padding:4px 0">
          <div style="width:6px; height:6px; border-radius:50%; background:#8A887F; flex:none"></div>
          <div style="font-size:14.5px; font-weight:600; color:#5A615F">{{ t }}</div>
        </div>
      </sc-for>
    </div>

  </div>

  <div style="flex:none; display:flex; gap:10px; padding:12px 16px 16px; background:#F3F2ED">
    <div style="flex:1; box-sizing:border-box; height:52px; background:#fff; border:1.5px solid #D5D0C4; border-radius:13px; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#EDEBE5" onClick="{{ handleBack }}">
      <span style="font-size:15.5px; font-weight:700; color:#5A615F">Назад</span>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Точка&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;вул. Хрещатик, 1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contact&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Контакт не вказано&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      handleBack: this.props.onBack || (() => {}),
      name: this.props.pointName || 'Точка',
      address: this.props.address || '',
      contact: this.props.contact || 'Контакт не вказано',
      tasks: this.props.tasks || ['Перевірити асортимент', 'Оновити прайс'],
    };
  }
}
</script>
</body>
</html>
