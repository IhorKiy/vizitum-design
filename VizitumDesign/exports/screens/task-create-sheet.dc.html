<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
body { margin:0; background:#E7E5DE; font-family:Manrope,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#14604a; text-decoration:none; }
a:hover { color:#0d4636; }
</style>
</helmet>
<div style="position:relative; width:393px; height:852px; margin:0 auto; background:#F3F2ED; overflow:hidden">
  <div style="position:absolute; inset:0; background:rgba(22,25,26,.42)" onClick="{{ handleBack }}"></div>
  <div style="position:absolute; left:0; right:0; bottom:0; height:82%; background:#F3F2ED; border-radius:22px 22px 0 0; box-shadow:0 -14px 40px rgba(16,24,40,.22); display:flex; flex-direction:column">
    <div style="align-self:center; width:38px; height:4px; border-radius:2px; background:#d8d5cd; margin:10px 0 2px"></div>
    <div style="flex:none; display:flex; align-items:center; padding:10px 18px 14px">
      <div style="flex:1; font-size:19px; font-weight:800; color:#14181a; letter-spacing:-.01em">Створити задачу</div>
      <div style="font-size:14px; font-weight:700; color:#5F5B52; cursor:pointer" style-active="opacity:.6" onClick="{{ handleBack }}">Закрити</div>
    </div>

    <div style="flex:1; min-height:0; overflow-y:auto; padding:0 18px 18px; display:flex; flex-direction:column; gap:18px">

      <div style="display:flex; flex-direction:column; gap:8px">
        <div style="font-size:13px; font-weight:700; color:#5A615F">Назва</div>
        <input type="text" placeholder="Наприклад: Перевірити наявність товару" style="height:48px; box-sizing:border-box; padding:0 14px; border:1px solid #D5D0C4; border-radius:12px; background:#fff; font-size:15px; font-family:inherit; color:#14181a" />
      </div>

      <div style="display:flex; flex-direction:column; gap:8px">
        <div style="display:flex; align-items:baseline; gap:6px">
          <div style="font-size:13px; font-weight:700; color:#5A615F">Деталі</div>
          <div style="font-size:11.5px; color:#B0AEA4">необов'язково</div>
        </div>
        <textarea placeholder="Необов'язковий контекст для цієї задачі" style="height:84px; box-sizing:border-box; padding:12px 14px; border:1px solid #D5D0C4; border-radius:12px; background:#fff; font-size:14.5px; font-family:inherit; color:#14181a; resize:none"></textarea>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px">
        <div style="font-size:13px; font-weight:700; color:#5A615F">Точка</div>
        <div style="height:48px; box-sizing:border-box; padding:0 14px; border:1px solid #D5D0C4; border-radius:12px; background:#fff; display:flex; align-items:center; gap:8px; cursor:pointer" style-active="opacity:.7">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21s7-6.3 7-11.5A7 7 0 0 0 5 9.5C5 14.7 12 21 12 21z" stroke="#5F6570" stroke-width="1.8" stroke-linejoin="round" /><circle cx="12" cy="9.5" r="2.4" stroke="#5F6570" stroke-width="1.8" /></svg>
          <span style="flex:1; font-size:14.5px; font-weight:600; color:#5F6570">{{ pointLabel }}</span>
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="m6 9.5 6 6 6-6" stroke="#8A8F98" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px">
        <div style="font-size:13px; font-weight:700; color:#5A615F">Термін</div>
        <div style="display:flex; gap:8px; flex-wrap:wrap">
          <div style="height:44px; padding:0 16px; box-sizing:border-box; border-radius:999px; border:{{ dueTodayBorder }}; background:{{ dueTodayBg }}; display:flex; align-items:center; cursor:pointer" style-active="opacity:.75" onClick="{{ setDueToday }}">
            <span style="font-size:13.5px; font-weight:800; color:{{ dueTodayColor }}">Сьогодні</span>
          </div>
          <div style="height:44px; padding:0 16px; box-sizing:border-box; border-radius:999px; border:{{ dueOtherBorder }}; background:{{ dueOtherBg }}; display:flex; align-items:center; cursor:pointer" style-active="opacity:.75" onClick="{{ setDueOther }}">
            <span style="font-size:13.5px; font-weight:800; color:{{ dueOtherColor }}">Інша дата</span>
          </div>
          <div style="height:44px; padding:0 16px; box-sizing:border-box; border-radius:999px; border:{{ dueNoneBorder }}; background:{{ dueNoneBg }}; display:flex; align-items:center; cursor:pointer" style-active="opacity:.75" onClick="{{ setDueNone }}">
            <span style="font-size:13.5px; font-weight:800; color:{{ dueNoneColor }}">Без дати</span>
          </div>
        </div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; gap:10px">
        <div style="font-size:15px; font-weight:800; color:#14181a">Пріоритет</div>
        <div style="width:46px; height:27px; border-radius:999px; background:{{ priorityTrackBg }}; padding:2px; box-sizing:border-box; cursor:pointer" style-active="opacity:.8" onClick="{{ togglePriority }}">
          <div style="width:23px; height:23px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.25); transform:{{ priorityKnobX }}; transition:transform .15s"></div>
        </div>
      </div>

    </div>

    <div style="flex:none; display:flex; gap:10px; padding:12px 18px calc(16px + env(safe-area-inset-bottom, 0px)); border-top:1px solid #E7E5DE; background:#F3F2ED">
      <div style="flex:1; height:50px; box-sizing:border-box; border:1.5px solid #D5D0C4; border-radius:13px; display:flex; align-items:center; justify-content:center; cursor:pointer" style-active="opacity:.7" onClick="{{ handleBack }}">
        <span style="font-size:15px; font-weight:700; color:#5A615F">Скасувати</span>
      </div>
      <div style="flex:1.35; height:50px; background:#14604a; border-radius:13px; display:flex; align-items:center; justify-content:center; cursor:pointer" style-active="opacity:.85" onClick="{{ handleBack }}">
        <span style="font-size:15px; font-weight:800; color:#fff">Створити задачу</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { due: 'none', priority: false };

  renderVals() {
    const s = this.state;
    const dueColor = (k) => s.due === k ? { border: '1px solid #14604a', bg: '#14604a', color: '#fff' } : { border: '1px solid #D5D0C4', bg: '#fff', color: '#5A615F' };
    const today = dueColor('today'), other = dueColor('other'), none = dueColor('none');
    return {
      handleBack: this.props.onBack || (() => {}),
      pointLabel: 'Без точки',
      dueTodayBorder: today.border, dueTodayBg: today.bg, dueTodayColor: today.color,
      dueOtherBorder: other.border, dueOtherBg: other.bg, dueOtherColor: other.color,
      dueNoneBorder: none.border, dueNoneBg: none.bg, dueNoneColor: none.color,
      setDueToday: () => this.setState({ due: 'today' }),
      setDueOther: () => this.setState({ due: 'other' }),
      setDueNone: () => this.setState({ due: 'none' }),
      priorityTrackBg: s.priority ? '#0F6B52' : '#D6D3C9',
      priorityKnobX: s.priority ? 'translateX(19px)' : 'translateX(0)',
      togglePriority: () => this.setState(st => ({ priority: !st.priority }))
    };
  }
}

</script>
</body>
</html>
