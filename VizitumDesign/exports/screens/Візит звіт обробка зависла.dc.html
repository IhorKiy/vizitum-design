<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
body { margin:0; background:#E7E5DE; font-family:Manrope,system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
a { color:#14604a; text-decoration:none; }
a:hover { color:#0d4636; }
</style>
</helmet>
<div style="position:relative; width:393px; height:852px; margin:0 auto; background:#F3F2ED; overflow:hidden; display:flex; flex-direction:column">

  <div style="flex:none; background:#fff; padding:14px 16px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #E6E4DD">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" style="flex:none"><path d="M19 12H5.5m0 0 5.2-5.2M5.5 12l5.2 5.2" stroke="#14604a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
    <div style="flex:1; min-width:0; font-size:17px; font-weight:800; color:#14181a">Аптека Життя Оболонь</div>
  </div>

  <div style="flex:1; min-height:0; overflow:hidden; padding:16px 16px 22px; display:flex; flex-direction:column; gap:14px; filter:blur(2px); opacity:.5">
    <div style="font-size:19px; font-weight:800; color:#14181a">Звіт про візит</div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px">
      <div style="height:72px; background:#fff; border:1.5px solid #C7D6D0; border-radius:13px"></div>
      <div style="height:72px; background:#fff; border:1.5px solid #E0DDD5; border-radius:13px"></div>
    </div>
    <div style="height:62px; background:#fff; border:1px solid #E7E5E0; border-radius:14px"></div>
    <div style="height:62px; background:#fff; border:1px solid #E7E5E0; border-radius:14px"></div>
  </div>

  <div style="position:absolute; inset:0; background:rgba(22,25,26,.34)"></div>

  <div style="position:absolute; left:0; right:0; bottom:0; background:#F7F6F2; border-radius:22px 22px 0 0; box-shadow:0 -14px 40px rgba(22,25,26,.22); display:flex; flex-direction:column">
    <div style="align-self:center; width:38px; height:4px; border-radius:2px; background:#D8D5CD; margin:10px 0 2px"></div>

    <div style="padding:20px 24px 0; display:flex; flex-direction:column; align-items:center; gap:14px; text-align:center">
      <div style="width:64px; height:64px; border-radius:19px; background:#FBF6E6; display:flex; align-items:center; justify-content:center">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.6" stroke="#9A7B1E" stroke-width="1.8" /><path d="M12 7.4v5l3.2 2" stroke="#9A7B1E" stroke-width="1.8" stroke-linecap="round" /></svg>
      </div>
      <div style="font-size:19px; font-weight:800; color:#14181a; letter-spacing:-.01em">Обробка триває довше, ніж зазвичай</div>
      <div style="font-size:14.5px; line-height:1.55; font-weight:500; color:#6B7371; text-wrap:pretty">Запис збережено, він нікуди не подінеться. Можна заповнити форму вручну — ми не чекатимемо.</div>
    </div>

    <div style="padding:22px 20px 30px; display:flex; flex-direction:column; gap:10px">
      <div style="height:52px; background:#14604a; border-radius:13px; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 18px rgba(20,96,74,.22)" style-hover="background:#0d4636">
        <span style="font-size:16px; font-weight:800; color:#fff">Заповнити вручну</span>
      </div>
      <div style="box-sizing:border-box; height:52px; background:#fff; border:1.5px solid #C7D6D0; border-radius:13px; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#E6EFEB">
        <span style="font-size:15.5px; font-weight:800; color:#14604a">Почекати ще</span>
      </div>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852}}"></script>
</body>
</html>
