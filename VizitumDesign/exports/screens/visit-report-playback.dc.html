<x-dc>

        <div style="font-size:22px; font-weight:800; color:#14181a; letter-spacing:-.02em">Аптека Життя Оболонь</div>
        <div style="font-size:14.5px; color:#8A8F98; font-weight:600">просп. Героїв Дніпра, 24, Київ</div>
      </div>
    </div>
    <div style="font-size:19px; font-weight:800; color:#14181a; letter-spacing:-.01em">Звіт про візит</div>

    <div style="height:62px; background:#fff; border:1px solid #E7E5E0; border-radius:14px"></div>
  </div>

  <div style="position:absolute; inset:0; background:rgba(22,25,26,.34)"></div>

  <div style="position:absolute; left:0; right:0; bottom:0; background:#F7F6F2; border-radius:22px 22px 0 0; box-shadow:0 -14px 40px rgba(22,25,26,.22); display:flex; flex-direction:column">
    <div style="align-self:center; width:38px; height:4px; border-radius:2px; background:#D8D5CD; margin:10px 0 2px"></div>

    <div style="padding:16px 20px 0; display:flex; align-items:center; gap:10px">
      <div style="width:9px; height:9px; border-radius:50%; background:#14604a"></div>
      <div style="flex:1; font-size:18px; font-weight:800; color:#14181a; letter-spacing:-.01em">Ваш запис</div>
      <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:17px; font-weight:700; color:#5A615F; letter-spacing:.02em">01:12</div>
    </div>

    <div style="padding:22px 20px 4px; display:flex; align-items:center; justify-content:center; gap:14px; height:96px">
      <div style="width:44px; height:44px; flex:none; border-radius:50%; background:#14604a; display:flex; align-items:center; justify-content:center; cursor:pointer" style-hover="background:#0d4636">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M8 5.5v13l10-6.5-10-6.5Z" fill="#fff" /></svg>

        <div style="width:3px; height:32px; border-radius:2px; background:#14604a"></div>
        <div style="width:3px; height:18px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:24px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:14px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:28px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:16px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:22px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:12px; border-radius:2px; background:#C7D6D0"></div>
        <div style="width:3px; height:20px; border-radius:2px; background:#C7D6D0"></div>
      </div>
      <div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:13px; font-weight:700; color:#8A8F98; flex:none">0:24</div>
    </div>

    <div style="padding:6px 24px 0; font-size:14px; line-height:1.5; color:#8A8F98; font-weight:600; text-align:center">Слухайте запис і за потреби надішліть його на повторне розпізнавання.</div>

    <div style="padding:22px 20px 0; display:flex; flex-direction:column; gap:10px">
      <div style="height:52px; background:#14604a; border-radius:13px; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer; box-shadow:0 8px 18px rgba(20,96,74,.22)" style-hover="background:#0d4636">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 13.6-5.7M20 12a8 8 0 0 1-13.6 5.7" stroke="#fff" stroke-width="1.9" stroke-linecap="round" /><path d="M17.2 3.6v3.4h-3.4M6.8 20.4V17h3.4" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" /></svg>

      <div style="box-sizing:border-box; height:52px; background:#fff; border:1.5px solid #C7D6D0; border-radius:13px; display:flex; align-items:center; justify-content:center; gap:9px; cursor:pointer" style-hover="background:#E6EFEB">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="9" y="2.8" width="6" height="10.4" rx="3" stroke="#14604a" stroke-width="1.8" /><path d="M5.5 11.4a6.5 6.5 0 0 0 13 0M12 17.9v3.3" stroke="#14604a" stroke-width="1.8" stroke-linecap="round" /></svg>

    <div style="padding:16px 20px 30px; display:flex; align-items:center; justify-content:center">
      <span style="font-size:14px; font-weight:700; color:#8A8F98; cursor:pointer" style-hover="color:#5A615F">Закрити</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:852}}"></script>
