<div style="margin-top:6px;font:700 19px/1.25 Commissioner,sans-serif;color:#141414;letter-spacing:-.01em">гнпнп</div>
</div>

<div>

<div style="font:500 13.5px/1.3 Commissioner,sans-serif;color:#8a908d">Точка</div>
<div style="font:700 14px/1.3 Commissioner,sans-serif;color:#141414">Без точки</div>
</div>

<div style="padding:16px 18px 18px;display:flex;flex-direction:column;gap:12px">
<div style="font:700 11px/1 Commissioner,sans-serif;letter-spacing:.11em;color:#8a908d">ІСТОРІЯ</div>
<div style="display:flex;gap:14px">
<div style="width:52px;flex:none;font:500 12.5px/1.4 JetBrains Mono,monospace;color:#8a908d">06.08<br />13:48</div>
<div style="flex:1;min-width:0">
<div style="font:700 14px/1.35 Commissioner,sans-serif;color:#141414">Створено</div>
<div style="font:400 13px/1.35 Commissioner,sans-serif;color:#8a908d">Demo Field Representative</div>
</div>
</div>
</div>

</div>

<div style="flex:none;display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid rgba(0,0,0,.09);background:#fff">

<button style="flex:none;height:48px;padding:0 22px;border:1px solid #ddd9d3;border-radius:11px;background:#fff;color:#141414;font:600 15px Commissioner,sans-serif;cursor:pointer" style-hover="background:#f4f2f0">Редагувати</button>

</div>
</div>
