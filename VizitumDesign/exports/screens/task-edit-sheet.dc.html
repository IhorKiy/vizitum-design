<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
body{margin:0;background:#f1efec;font-family:Commissioner,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#14604a}a:hover{color:#0d4636}
</style>
</helmet>
<div style="width:392px;height:760px;margin:0 auto;background:#f4f2f0;position:relative;overflow:hidden">

<div style="position:absolute;inset:0;background:rgba(20,18,16,.42)"></div>

<div style="position:absolute;left:0;right:0;bottom:0;top:12px;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);display:flex;flex-direction:column">

<div style="flex:none;display:flex;align-items:center;gap:12px;padding:0 18px;height:56px;border-bottom:1px solid rgba(0,0,0,.09)">
<div style="flex:1;font:700 19px Commissioner,sans-serif;color:#141414;letter-spacing:-.01em">Редагувати задачу</div>
<div style="font:600 14px Commissioner,sans-serif;color:#7c8280;cursor:pointer" style-hover="color:#141414">Закрити</div>
</div>

<div style="flex:1;min-height:0;overflow-y:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:17px">

<div style="display:flex;flex-direction:column;gap:8px">
<div style="font:700 11px/1 Commissioner,sans-serif;letter-spacing:.11em;color:#8a908d">НАЗВА</div>
<div style="border:1px solid #ddd9d3;border-radius:11px;padding:14px 14px;font:600 15.5px/1.3 Commissioner,sans-serif;color:#141414">гнпнп</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:baseline;gap:8px">
<div style="font:700 11px/1 Commissioner,sans-serif;letter-spacing:.11em;color:#8a908d">ДЕТАЛІ</div>
<div style="font:600 11.5px/1 Commissioner,sans-serif;color:#b0b4b1">необов'язково</div>
</div>
<div style="border:1px solid #ddd9d3;border-radius:11px;padding:13px 14px;min-height:70px;font:400 14.5px/1.45 Commissioner,sans-serif;color:#a3a8a5">Необов'язковий контекст для цієї задачі</div>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="font:700 11px/1 Commissioner,sans-serif;letter-spacing:.11em;color:#8a908d">ТОЧКА</div>
<div style="border:1px solid #ddd9d3;border-radius:11px;padding:13px 14px;display:flex;align-items:center;gap:10px">
<svg viewBox="0 0 14 16" width="14" height="16" fill="none" style="flex:none;display:block"><path d="M7 15c3.4-4.1 5-6.6 5-9A5 5 0 1 0 2 6c0 2.4 1.6 4.9 5 9Z" stroke="#8a908d" stroke-width="1.3"></path><circle cx="7" cy="6" r="1.9" stroke="#8a908d" stroke-width="1.3"></circle></svg>
<span style="flex:1;font:500 15.5px/1.2 Commissioner,sans-serif;color:#141414">Без точки</span>
<svg viewBox="0 0 14 8" width="14" height="8" fill="none" style="flex:none;display:block"><path d="m1 1 6 6 6-6" stroke="#8a908d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:9px">
<div style="font:700 11px/1 Commissioner,sans-serif;letter-spacing:.11em;color:#8a908d">ТЕРМІН</div>
<div style="display:flex;gap:9px">
<div style="flex:none;padding:11px 17px;border-radius:999px;border:1px solid #ddd9d3;background:#fff;color:#141414;font:600 14px Commissioner,sans-serif;cursor:pointer">Сьогодні</div>
<div style="flex:none;padding:11px 17px;border-radius:999px;border:1px solid #ddd9d3;background:#fff;color:#141414;font:600 14px Commissioner,sans-serif;cursor:pointer">Інша дата</div>
<div style="flex:none;padding:11px 17px;border-radius:999px;background:#14604a;color:#fff;font:600 14px Commissioner,sans-serif;cursor:pointer">Без дати</div>
</div>
</div>

<div style="display:flex;align-items:center;gap:12px;padding:2px 0">
<div style="flex:1;font:700 17px/1.2 Commissioner,sans-serif;color:#141414">Пріоритет</div>
<div style="width:52px;height:31px;flex:none;border-radius:999px;background:#e2e0dc;padding:3px;display:flex;justify-content:flex-start;cursor:pointer">
<div style="width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.22)"></div>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:9px">
<div style="font:700 11px/1 Commissioner,sans-serif;letter-spacing:.11em;color:#8a908d">СТАТУС</div>
<div style="display:flex;gap:9px">
<div style="flex:1;text-align:center;padding:14px 0;border-radius:11px;background:#14604a;color:#fff;font:700 15px Commissioner,sans-serif;cursor:pointer">У процесі</div>
<div style="flex:1;text-align:center;padding:14px 0;border-radius:11px;border:1px solid #ddd9d3;background:#fff;color:#141414;font:600 15px Commissioner,sans-serif;cursor:pointer">Виконано</div>
</div>
</div>

</div>

<div style="flex:none;display:flex;gap:10px;padding:12px 18px 18px;border-top:1px solid rgba(0,0,0,.09);background:#fff">
<button style="flex:none;height:48px;padding:0 22px;border:1px solid #ddd9d3;border-radius:11px;background:#fff;color:#141414;font:600 15px Commissioner,sans-serif;cursor:pointer" style-hover="background:#f4f2f0">Скасувати</button>
<button style="flex:1;height:48px;border:0;border-radius:11px;background:#14604a;color:#fff;font:700 15px Commissioner,sans-serif;cursor:pointer" style-hover="background:#0d4636">Зберегти зміни</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:392,&quot;height&quot;:760}}"></script>
</body>
</html>
